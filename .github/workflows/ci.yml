# CI — Daily Dose of Curiosity pipeline
#
# Gates: type check + lint + episode verification.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc -b

      - name: Lint
        run: bun run lint

      - name: Verify episodes (anchors, banned strings, FACTS, tails)
        run: bun run verify
