# CI — Daily Dose of Curiosity pipeline
#
# Gates: type check + episode verification.
# NOTE: `bun run lint` is intentionally not a blocking gate yet — the repo
# currently carries 9 pre-existing lint errors (any-types in Episode/Dashboard,
# react-refresh export rules in Hud/KaraokeCaption/Starfield). Lint is on the
# debt list; add it here once `bun run lint` exits 0.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc -b

      - name: Verify episodes (anchors, banned strings, FACTS, tails)
        run: bun run verify
